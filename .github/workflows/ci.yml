name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run continuity-film --help
      - name: Validate skill folders
        run: |
          for skill in skills/*; do
            python scripts/quick_validate_skill.py "$skill"
          done
      - name: Validate pinned Machina skills
        run: |
          for skill in upstream/machina-film-studio-skills/skills/*; do
            python scripts/quick_validate_skill.py --source-only "$skill"
          done
