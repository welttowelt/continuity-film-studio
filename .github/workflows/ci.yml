name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run continuity-film --help
      - name: Validate skill folders
        run: |
          for skill in skills/*; do
            python scripts/quick_validate_skill.py "$skill"
          done
      - name: Validate pinned Machina skills
        run: |
          for skill in upstream/machina-film-studio-skills/skills/*; do
            python scripts/quick_validate_skill.py --source-only "$skill"
          done
      - name: Validate project-scoped skill links
        run: |
          for skill in .agents/skills/* .claude/skills/*; do
            test -L "$skill"
            test -d "$skill"
          done
      - name: Verify upstream pin manifest
        run: uv run python scripts/check_upstream_pin.py
