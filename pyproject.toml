[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-film-studio"
version = "0.2.0"
description = "A continuity-first, provider-aware operating system for AI film production."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "welttowelt" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pyyaml>=6,<7",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
continuity-film = "continuity_film_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
